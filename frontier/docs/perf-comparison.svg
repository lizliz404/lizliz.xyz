  <!-- main panel -->
  <rect x="32" y="112" width="1216" height="376" rx="10" fill="#fffdf8" stroke="#e4dfd2"/>
  <text x="64" y="148" font-size="16" font-weight="600" fill="#141413">首屏传输（kB gzip）</text>
