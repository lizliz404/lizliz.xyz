  <!-- bottom right: details -->
  <rect x="654" y="508" width="594" height="160" rx="10" fill="#fffdf8" stroke="#e4dfd2"/>
  <text x="686" y="544" font-size="16" font-weight="600" fill="#141413">同样口径下的其他项</text>
  <g font-size="14" fill="#716d64">
    <text x="686" y="576">· 每篇 HTML 的 RSC 重复序列化：~51 kB → 0</text>
    <text x="686" y="604">· JS 请求数：11 → 1</text>
    <text x="686" y="632">· 首页首载：228 kB → 142 kB gzip（−38%）</text>
