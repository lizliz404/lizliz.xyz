  <!-- bottom left: deps -->
  <rect x="32" y="508" width="594" height="160" rx="10" fill="#fffdf8" stroke="#e4dfd2"/>
  <text x="64" y="544" font-size="16" font-weight="600" fill="#141413">node_modules 体积</text>
  <text x="64" y="578" font-size="14" fill="#716d64">现在</text>
