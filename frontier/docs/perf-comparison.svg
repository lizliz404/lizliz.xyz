<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Inter, 'Noto Sans CJK SC', sans-serif">
  <rect width="1280" height="700" fill="#faf9f5"/>
  <text x="40" y="54" font-size="23" font-weight="600" fill="#141413">首屏体积 · lizliz.xyz</text>

  <!-- legend -->
