  <!-- JS -->
  <text x="64" y="190" font-size="15" fill="#141413">JavaScript</text>
  <text x="64" y="207" font-size="12" fill="#9a948a">首屏全部 JS 文件</text>
  <rect x="330" y="178" width="527" height="20" rx="3" fill="#c9c3b4"/>
