  <rect x="330" y="258" width="105" height="20" rx="3" fill="#c9c3b4"/>
  <text x="443" y="273" font-size="14" fill="#8a8578">现在 39 kB</text>
  <rect x="330" y="284" width="86" height="20" rx="3" fill="#ad4b23"/>
  <text x="424" y="299" font-size="14" fill="#ad4b23">实验 32 kB</text>

  <!-- CSS -->
  <text x="64" y="350" font-size="15" fill="#141413">CSS</text>
  <text x="64" y="367" font-size="12" fill="#9a948a">Tailwind 全量 vs StyleX 编译产物</text>
  <rect x="330" y="338" width="49" height="20" rx="3" fill="#c9c3b4"/>
