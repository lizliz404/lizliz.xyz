  <!-- total -->
  <text x="64" y="430" font-size="15" font-weight="600" fill="#141413">合计</text>
  <text x="64" y="447" font-size="12" fill="#9a948a">HTML + JS + CSS 首载</text>
  <rect x="330" y="418" width="680" height="20" rx="3" fill="#c9c3b4"/>
  <text x="1018" y="433" font-size="14" font-weight="600" fill="#716d64">现在 252 kB</text>
  <rect x="330" y="444" width="459" height="20" rx="3" fill="#ad4b23"/>
