  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#inkWash)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#B14E22" opacity="0.72"/>

  <g transform="translate(92, 160)">
    <rect x="0" y="0" width="280" height="280" rx="36" fill="#1C1915"/>
    <!-- script page -->
