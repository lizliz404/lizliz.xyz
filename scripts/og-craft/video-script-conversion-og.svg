    <circle cx="196" cy="156" r="44" fill="#B14E22"/>
    <path d="M178 132v48c0 8.5 9.5 14 16.5 8l34-24c6-4.2 6-11.8 0-16l-34-24c-7-6-16.5-.5-16.5 8z" fill="#FAF9F5"/>
