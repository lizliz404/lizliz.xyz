<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="55%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EFE8DC"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1915" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#B14E22" stop-opacity="0.08"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      .brand { font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 22px; letter-spacing: 0.18em; fill: #716D64; }
      .title { font-family: 'Liberation Serif', 'DejaVu Serif', serif; font-size: 68px; fill: #141413; }
      .zh { font-family: 'Noto Sans CJK SC', 'Noto Serif CJK SC', 'DejaVu Sans', sans-serif; font-size: 24px; fill: #B14E22; }
      .sub { font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 26px; fill: #716D64; }
      .foot { font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 20px; letter-spacing: 0.12em; fill: #9B9488; }
    ]]></style>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#inkWash)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#B14E22" opacity="0.72"/>

  <!-- Icon block: layered template sheets -->
  <g transform="translate(92, 150)">
    <rect x="0" y="0" width="280" height="280" rx="36" fill="#1C1915"/>
    <!-- back sheet -->
    <rect x="60" y="96" width="160" height="120" rx="12" fill="#B14E22" opacity="0.5"/>
    <!-- mid sheet -->
    <rect x="60" y="72" width="160" height="120" rx="12" fill="#E8A87C" opacity="0.75"/>
    <!-- front sheet -->
    <rect x="60" y="48" width="160" height="120" rx="12" fill="#F5F1E8"/>
    <!-- content lines -->
    <rect x="84" y="74" width="72" height="8" rx="4" fill="#B14E22"/>
    <rect x="84" y="98" width="112" height="7" rx="3.5" fill="#8A857B"/>
    <rect x="84" y="118" width="96" height="7" rx="3.5" fill="#8A857B" opacity="0.7"/>
    <rect x="84" y="138" width="104" height="7" rx="3.5" fill="#8A857B" opacity="0.55"/>
    <rect x="84" y="158" width="60" height="7" rx="3.5" fill="#B14E22" opacity="0.6"/>
  </g>

  <text x="440" y="168" class="brand">TEMPLATE PACK  &#183;  LIZLIZ.XYZ</text>
  <text x="440" y="252" class="title">Design</text>
  <text x="440" y="324" class="title">Templates</text>
  <text x="440" y="382" class="zh">设计模板资源包 &#183; 设计系统 / UI 模式 / 工艺清单</text>
  <text x="440" y="448" class="sub">Reusable design systems, landing pages,</text>
  <text x="440" y="488" class="sub">UI micro-patterns and craft checklists.</text>

  <line x1="440" y1="556" x2="1080" y2="556" stroke="#DDD7CA" stroke-width="2"/>
  <text x="440" y="598" class="foot">lizliz.xyz/templates</text>
</svg>
