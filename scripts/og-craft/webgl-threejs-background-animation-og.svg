<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="55%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EFE8DC"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1915" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#B14E22" stop-opacity="0.08"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      .brand { font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 22px; letter-spacing: 0.18em; fill: #716D64; }
      .title { font-family: 'Liberation Serif', 'DejaVu Serif', serif; font-size: 56px; fill: #141413; }
      .zh { font-family: 'Noto Sans CJK SC', 'Noto Serif CJK SC', 'DejaVu Sans', sans-serif; font-size: 24px; fill: #B14E22; }
      .sub { font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 26px; fill: #716D64; }
      .foot { font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 20px; letter-spacing: 0.12em; fill: #9B9488; }
    ]]></style>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#inkWash)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#B14E22" opacity="0.72"/>

  <!-- Icon block: dashed wireframe ink garden (sketch layer + accent dissolve dot) -->
  <g transform="translate(92, 160)">
    <rect x="0" y="0" width="280" height="280" rx="36" fill="#1C1915"/>
    <!-- stem arc (dashed sketch) -->
    <path d="M56 226 C 92 178, 118 96, 196 62" stroke="#E8E4DD" stroke-width="8" fill="none" stroke-dasharray="16 10"/>
    <!-- leaf arc (lighter annotation layer) -->
    <path d="M112 168 C 148 150, 168 116, 186 88" stroke="#716D64" stroke-width="6" fill="none" stroke-dasharray="11 10"/>
    <!-- dimension tick -->
    <path d="M150 214 L 208 214" stroke="#716D64" stroke-width="6"/>
    <path d="M208 196 L 208 232" stroke="#716D64" stroke-width="6"/>
    <!-- accent dissolve dot -->
    <circle cx="196" cy="62" r="11" fill="#B14E22"/>
    <circle cx="196" cy="62" r="24" stroke="#B14E22" stroke-width="5" opacity="0.7"/>
  </g>

  <text x="440" y="168" class="brand">SKILL PACK  &#183;  LIZLIZ.XYZ</text>
  <text x="440" y="252" class="title">WebGL Three.js</text>
  <text x="440" y="320" class="title">Background Animation</text>
  <text x="440" y="382" class="zh">融入页面的 3D 背景动画与游戏动效</text>
  <text x="440" y="448" class="sub">Batched lines, config-driven materials, dissolve,</text>
  <text x="440" y="488" class="sub">orbital parallax — zero GPU when invisible.</text>

  <line x1="440" y1="556" x2="1080" y2="556" stroke="#DDD7CA" stroke-width="2"/>
  <text x="440" y="598" class="foot">lizliz.xyz/skills/webgl-threejs-background-animation</text>
</svg>
