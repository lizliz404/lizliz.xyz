*, *::before, *::after { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: var(--stage-bg);
  color: var(--fg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--selection); }

.deck-viewport {
  position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse 120% 80% at 30% 20%, #d4824f 0%, var(--bg) 55%, var(--bg-deep) 100%);
}
.deck-stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  overflow: hidden; transform-origin: 0 0;
  background: transparent;
}
.slide {
  position: absolute; inset: 0;
  width: 1920px; height: 1080px;
  overflow: hidden; display: block;
  visibility: hidden; opacity: 0; pointer-events: none;
  background: transparent;
  transition: opacity 380ms ease, transform 380ms ease;
  will-change: opacity, transform;
}
.slide.active, .slide.visible {
  visibility: visible; opacity: 1; pointer-events: auto; z-index: 1;
}
.slide.from-down { transform: translateY(28px); }
.slide.from-up { transform: translateY(-28px); }
.slide.active { transform: translateY(0); }

.slide-inner {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  padding: 72px 110px 80px;
  display: flex; flex-direction: column;
}
.slide-table h2 { font-size: 48px; }
.slide-table .lead { font-size: 18px; margin-top: 8px; }

.tex-veil {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.tex-veil__paper {
  position: absolute; inset: -4%;
  background-image: var(--tex-paper);
  background-size: 720px 540px;
  opacity: 0.09;
  mix-blend-mode: soft-light;
  animation: tex-drift 90s linear infinite alternate;
  will-change: transform;
}
@keyframes tex-drift {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-28px, 16px, 0); }
}

.progress-rail {
  position: fixed; top: 0; left: 0; right: 0; height: 4px;
  z-index: 40; display: flex; gap: 2px; padding: 0;
  background: rgba(138, 74, 32, 0.35);
}
.progress-tick {
  flex: 1; height: 4px; background: rgba(247, 245, 239, 0.22);
  position: relative; overflow: hidden;
}
.progress-tick::after {
  content: ""; position: absolute; inset: 0;
  background-image: var(--tex-halftone);
  background-size: 48px 36px; opacity: 0.4;
  mix-blend-mode: soft-light;
  transform-origin: center;
  animation: tex-pulse 4.8s ease-in-out infinite;
}
.progress-tick.on { background: var(--paper); }
.progress-tick.on::after { opacity: 0.65; }
@keyframes tex-pulse {
  0%, 100% { transform: scale(1); opacity: 0.35; }
  50% { transform: scale(1.08); opacity: 0.65; }
}

.deck-chapter {
  position: fixed; right: 18px; top: 50%;
  transform: translateY(-50%);
  z-index: 35; width: 72px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  pointer-events: none;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
  color: var(--muted-on-orange); text-transform: uppercase;
}
.deck-chapter .pg { color: var(--paper); font-size: 11px; }
.deck-chapter .rule {
  width: 28px; height: 2px; background: rgba(247, 245, 239, 0.35);
  position: relative; overflow: hidden;
}
.deck-chapter .rule::after {
  content: ""; position: absolute; inset: 0;
  background-image: var(--tex-waves);
  background-size: 40px 8px; opacity: 0.85;
}
.deck-chapter .name {
  writing-mode: vertical-rl; text-orientation: mixed;
  max-height: 220px; overflow: hidden;
  word-break: keep-all; color: var(--paper);
}

.edge-flute {
  position: absolute; left: 0; top: 72px; bottom: 72px; width: 10px;
  background-image: var(--tex-fluted);

    "heat-matrix"(d) {

      const rows = concepts.map((c, ri) => {
        const y = oy + ri * cell;
        const cells = (values[ri] || []).map((v, ci) => {
          const opacity = 0.15 + (v / 100) * 0.75;
          return `<rect x="${ox + ci * cell}" y="${y}" width="${cell - 4}" height="${cell - 4}" rx="8"
            fill="${ORANGE}" opacity="${opacity.toFixed(2)}"/>
            <text x="${ox + ci * cell + cell / 2}" y="${y + cell / 2 + 4}" text-anchor="middle" font-size="11">${v}</text>`;

      const colors = [ORANGE, INK, MUTED, BORDER];
      const paths = slices.map((s, i) => {
        const sweep = (s.pct / total) * 360;
        const a1 = angle * Math.PI / 180;
        const a2 = (angle + sweep) * Math.PI / 180;
        const x1 = 260 + Math.cos(a1) * 140;
        const y1 = 220 + Math.sin(a1) * 140;
        const x2 = 260 + Math.cos(a2) * 140;
        const y2 = 220 + Math.sin(a2) * 140;
        const large = sweep > 180 ? 1 : 0;
        angle += sweep;
        return `<path d="M260,220 L${x1},${y1} A140,140 0 ${large} 1 ${x2},${y2} Z" fill="${colors[i % colors.length]}" opacity="0.88"/>`;
      }).join("");
      const legend = slices.map((s, i) =>
        `<g>
          <rect x="460" y="${80 + i * 48}" width="16" height="16" rx="4" fill="${colors[i % colors.length]}"/>
          <text x="490" y="${94 + i * 48}" font-size="15">${esc(s.label)} · ${s.pct}% (${(s.pct * 3.6).toFixed(0)}°)</text>

      const moves = (d.moves || []).map((m, i) =>
        `<text class="muted" x="460" y="${300 + i * 28}" font-size="13">${esc(m)}</text>`).join("");

      </svg></div>`;
    },
    "spectrum"(d) {
      return `<div class="diag"><svg viewBox="0 0 760 360" role="img" aria-label="确定性光谱">
        <rect x="80" y="148" width="600" height="24" rx="12" fill="${PAPER}" stroke="${BORDER}"/>
        <rect x="80" y="148" width="200" height="24" rx="12" fill="${INK}" opacity="0.85"/>
        <rect x="280" y="148" width="200" height="24" fill="${ORANGE}" opacity="0.55"/>
        <rect x="480" y="148" width="200" height="24" rx="12" fill="${MUTED}" opacity="0.5"/>
        <circle cx="100" cy="160" r="14" fill="${INK}"/>
        <circle cx="380" cy="160" r="18" fill="${ORANGE}"/>
        <circle cx="660" cy="160" r="14" fill="${MUTED}"/>
        <text x="100" y="220" text-anchor="middle" font-size="15">${esc(d.left)}</text>
        <text x="380" y="220" text-anchor="middle" font-size="17" fill="${ORANGE}" font-family="${SERIF}">${esc(d.mid)}</text>

    "onion"(d) {

        return `<g>
          <circle cx="380" cy="220" r="${r}" fill="${fills[i % 3]}" opacity="${op}" stroke="${BORDER}"/>

    },
    "cost-curves"(d) {
      const x0 = 100, x1 = 680, yBase = 320;
      const clientY = 140;
      const apiY0 = 300, apiY1 = 95;
      const crossX = 564;
      const crossY = clientY;
      const compare = (d.compare || []).map((row, i) => {
        const y = 56 + i * 36;
        return `<g>
          <text x="40" y="${y}" font-size="13" font-family="${MONO}">${esc(row.dim)}</text>
          <text x="200" y="${y}" font-size="13">${esc(row.client)}</text>

      }).join("");
      return `<div class="diag"><svg viewBox="0 0 760 480" role="img" aria-label="成本曲线">
        <text class="muted" x="40" y="28" font-size="12" font-family="${MONO}">COST · 客户端平线 vs API 斜线</text>
        <line x1="${x0}" y1="${yBase}" x2="${x1}" y2="${yBase}" stroke="${BORDER}"/>
        <line x1="${x0}" y1="${yBase}" x2="${x0}" y2="80" stroke="${BORDER}"/>
        <text class="muted" x="30" y="100" font-size="11">费用</text>
        <line x1="${x0}" y1="${clientY}" x2="${x1}" y2="${clientY}" stroke="${INK}" stroke-width="3"/>
        <line x1="${x0}" y1="${apiY0}" x2="${x1}" y2="${apiY1}" stroke="${ORANGE}" stroke-width="3"/>
        <circle cx="${crossX}" cy="${crossY}" r="9" fill="${ORANGE}"/>
        <line x1="${crossX}" y1="${crossY}" x2="${crossX}" y2="${yBase}" stroke="${BORDER}" stroke-dasharray="4 4"/>
        <text x="${crossX + 12}" y="${crossY - 8}" font-size="13" fill="${ORANGE}">${esc(d.cross || "切换点")}</text>
        <text x="560" y="${clientY - 10}" font-size="13">${esc((d.lines && d.lines[0] && d.lines[0].name) || "客户端")}</text>
        <text x="560" y="88" font-size="13" fill="${ORANGE}">${esc((d.lines && d.lines[1] && d.lines[1].name) || "API")}</text>
        <text class="muted" x="390" y="${yBase + 24}" text-anchor="middle" font-size="12">用量 →</text>

        ${compare}
      </svg></div>`;
    },
    "combo-gantt"(d) {
      const steps = d.steps || [];
      const total = steps.reduce((a, s) => a + (s.dur || 1), 0) || 1;
      const trackW = 600;
      let offset = 0;
      const bars = steps.map((s, i) => {
        const w = (s.dur / total) * trackW;
        const x = 80 + offset;
        offset += w;
        const label = s.label || s;
        return `<g>
          <rect x="${x}" y="160" width="${w - 4}" height="48" rx="10"
            fill="${i === 0 || i === steps.length - 1 ? ORANGE : PAPER}"
            opacity="${i === 0 || i === steps.length - 1 ? 0.85 : 1}"
            stroke="${ORANGE}" stroke-width="${i === 0 || i === steps.length - 1 ? 0 : 1}"/>
          <text x="${x + w / 2}" y="188" text-anchor="middle" font-size="12"
            fill="${i === 0 || i === steps.length - 1 ? PAPER : INK}">${esc(label)}</text>
        </g>`;
      }).join("");
      const ticks = steps.map((s, i) => {
        const pct = steps.slice(0, i + 1).reduce((a, st) => a + st.dur, 0) / total;

        return `<line x1="${x}" y1="150" x2="${x}" y2="220" stroke="${BORDER}" stroke-dasharray="3 3"/>`;

        <rect x="80" y="150" width="${trackW}" height="58" rx="12" fill="${PAPER}" stroke="${BORDER}"/>
        ${ticks}${bars}
        <text class="muted" x="80" y="280" font-size="13">左=意图 右=交付 · 中间器官接力</text>

    }

  function renderDiagram(slide) {
    const d = slide.diagram || { kind: "end-mark" };
    const fn = Diagrams[d.kind];
    return fn ? fn(d) : "";
  }

  const Templates = {
    cover(s) {
      const pills = (s.pills || []).map((p) => `<span class="pill" data-field="pill">${esc(p)}</span>`).join("");
      return `<section class="slide slide-cover" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">

          ${field("h1", "title", s.title, "title")}
          ${field("p", "subtitle", s.subtitle, "subtitle")}
          ${field("p", "lead", s.lead, "lead")}
          <div class="pill-row">${pills}</div>
        </div>
      </section>`;
    },
    statement(s) {
      return `<section class="slide slide-statement" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="local-tex" aria-hidden="true"></div>
        <div class="slide-inner">
          ${field("p", "kicker", s.kicker, "kicker")}
          ${field("h2", "title", s.title, "title")}
          ${field("p", "lead", s.lead, "lead")}
        </div>
      </section>`;
    },
    concept(s) {
      return `<section class="slide slide-concept" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="edge-flute" aria-hidden="true"></div>

          ${field("p", "kicker", s.kicker, "kicker")}
          <div class="concept-grid">

              <div class="wave-divider" aria-hidden="true"></div>
              ${field("p", "essence", s.essence, "essence")}
              ${field("p", "why", s.why, "why")}
              ${howList(s.how)}
              ${field("p", "insight", s.insight, "insight")}
            </div>
            <div class="diagram-panel">${renderDiagram(s)}</div>
          </div>
        </div>
      </section>`;
    },
    diagram(s) {
      return `<section class="slide slide-diagram" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="slide-inner">
          ${field("p", "kicker", s.kicker, "kicker")}
          ${field("h2", "title", s.title, "title")}
          ${field("p", "lead", s.lead || "", "lead")}
          <div class="diagram-panel" style="margin-top:28px;flex:1;min-height:0">${renderDiagram(s)}</div>
        </div>
      </section>`;
    },
    table(s) {
      const groups = (s.groups || []).map((g) => {
        const cards = (g.items || []).map((it) => `
          <article class="gloss-card">
            <h3 class="term" data-field="term">${esc(it.term)}</h3>
            <p class="def" data-field="def">${esc(it.def)}</p>
          </article>`).join("");
        return `<div class="glossary-group">
          <h3 data-field="group">${esc(g.name)}</h3>
          <div class="glossary-grid">${cards}</div>
        </div>`;
      }).join("");
      return `<section class="slide slide-table" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="slide-inner">
          ${field("p", "kicker", s.kicker, "kicker")}
          ${field("h2", "title", s.title, "title")}
          ${field("p", "lead", s.lead || "", "lead")}
          <div class="glossary-wrap">${groups}</div>
        </div>
      </section>`;
    },
    compare(s) {
      const rows = (s.rows || []).map((r) => `
        <tr>
          <td data-field="concept">${esc(r.concept)}</td>
          <td data-field="unit">${esc(r.unit)}</td>
          <td data-field="fail">${esc(r.fail)}</td>
        </tr>`).join("");
      const heat = renderDiagram(s);
      return `<section class="slide slide-compare" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="slide-inner">
          ${field("p", "kicker", s.kicker, "kicker")}
          ${field("h2", "title", s.title, "title")}
          ${field("p", "lead", s.lead || "", "lead")}
          <div style="display:grid;grid-template-columns:1fr 1.1fr;gap:20px;flex:1;min-height:0;margin-top:12px">
            <div class="diagram-panel" style="min-height:0;padding:16px">${heat}</div>
            <table class="matrix-table" style="align-self:start">
              <thead><tr><th>概念</th><th>单位</th><th>坏掉时</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </section>`;
    },
    quote(s) {
      return `<section class="slide slide-quote" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="local-tex" aria-hidden="true"></div>
        <div class="slide-inner">
          ${field("p", "kicker", s.kicker, "kicker")}
          ${field("h2", "title", s.title, "title")}
          <div class="quote-layout" style="margin-top:24px">
            <div>
              <p class="quote-text" data-field="quote">${esc(s.quote)}</p>
              <p class="quote-attr" data-field="attribution">${esc(s.attribution || "")}</p>
              ${field("p", "lead", s.lead || "", "lead")}
            </div>
            <div class="diagram-panel">${renderDiagram(s)}</div>
          </div>
        </div>
      </section>`;
    },
    end(s) {
      return `<section class="slide slide-end" data-id="${esc(s.id)}" data-chapter="${esc(s.chapter)}">
        <div class="slide-inner">
          ${field("p", "kicker", s.kicker, "kicker")}
          ${field("h2", "title", s.title, "title")}
          ${field("p", "lead", s.lead || "", "lead")}
          ${renderDiagram(s)}
        </div>
      </section>`;
    }
  };

  function renderDeck(content) {
    const stage = document.getElementById("stage");
    if (!stage) throw new Error("missing #stage");
    stage.innerHTML = content.map((s) => {
      const tpl = Templates[s.type];
      if (!tpl) throw new Error("unknown type: " + s.type);
      return tpl(s);
    }).join("\n");
  }

  window.__ATLAS_RENDER__ = { renderDeck, Templates, Diagrams };
})();

      this.index = 0;
      this.locked = false;
      this.wheelAcc = 0;
      this.wheelTimer = null;
      this.touchStartX = 0;
      this.touchStartY = 0;
      this.buildProgress();
      this.setupStageScale();
      this.setupKeyboardNav();
      this.setupWheelNav();
      this.setupTouchNav();
      this.applySlide(0, true);
    }

    buildProgress() {
      if (!this.progress) return;
      this.progress.innerHTML = this.slides.map(() =>
        `<span class="progress-tick"></span>`).join("");
      this.ticks = Array.from(this.progress.querySelectorAll(".progress-tick"));
    }

    setupStageScale() {
      const scale = () => {
        const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const x = (window.innerWidth - 1920 * factor) / 2;
        const y = (window.innerHeight - 1080 * factor) / 2;
        this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
      };
      scale();
      window.addEventListener("resize", scale);
    }

    setupKeyboardNav() {
      window.addEventListener("keydown", (e) => {
        if (e.target && e.target.isContentEditable) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (["ArrowDown", "PageDown", " ", "Spacebar", "ArrowRight"].includes(e.key)) {
          e.preventDefault(); this.next();
        } else if (["ArrowUp", "PageUp", "ArrowLeft"].includes(e.key)) {
          e.preventDefault(); this.prev();
        } else if (e.key === "Home") {
          e.preventDefault(); this.goTo(0, -1);
        } else if (e.key === "End") {
          e.preventDefault(); this.goTo(this.slides.length - 1, 1);
        }
      });
    }

    setupWheelNav() {
      window.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (this.locked) return;
        this.wheelAcc += e.deltaY;
        if (this.wheelTimer) clearTimeout(this.wheelTimer);
        this.wheelTimer = setTimeout(() => { this.wheelAcc = 0; }, 180);
        if (Math.abs(this.wheelAcc) < 48) return;
        const dir = this.wheelAcc > 0 ? 1 : -1;
        this.wheelAcc = 0;
        if (dir > 0) this.next(); else this.prev();
      }, { passive: false });
    }

    setupTouchNav() {
      const vp = document.querySelector(".deck-viewport");
      vp.addEventListener("touchstart", (e) => {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        this.touchStartX = e.changedTouches[0].clientX;
        this.touchStartY = e.changedTouches[0].clientY;
      }, { passive: true });
      vp.addEventListener("touchend", (e) => {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - this.touchStartX;
        const dy = e.changedTouches[0].clientY - this.touchStartY;
        if (Math.abs(dy) < 40 || Math.abs(dy) < Math.abs(dx)) return;
        if (dy < 0) this.next(); else this.prev();
      }, { passive: true });
    }

    next() { this.goTo(this.index + 1, 1); }
    prev() { this.goTo(this.index - 1, -1); }

    goTo(index, direction) {
      if (this.locked) return;
      if (index < 0 || index >= this.slides.length || index === this.index) return;
      this.applySlide(index, false, direction);
    }

    applySlide(index, instant, direction) {
      const prev = this.index;
      this.index = index;
      const dir = direction == null ? (index >= prev ? 1 : -1) : direction;
      this.slides.forEach((s, i) => {
        s.classList.remove("active", "visible", "from-up", "from-down");
        if (i === index) {
          if (!instant && !reduceMotion()) {
            s.classList.add(dir > 0 ? "from-down" : "from-up");
            void s.offsetWidth;
          }
          s.classList.add("active", "visible");
        }
      });
      if (this.ticks) {
        this.ticks.forEach((t, i) => t.classList.toggle("on", i <= index));
      }
      if (this.chapterEl) {
        const slide = this.slides[index];
        const chapter = slide.getAttribute("data-chapter") || "";
        this.chapterEl.querySelector(".pg").textContent =
          String(index + 1).padStart(2, "0") + " / " + String(this.slides.length).padStart(2, "0");
        this.chapterEl.querySelector(".name").textContent = chapter;
      }
      // parallax-ish: shift global texture slightly with page index
      const paper = document.querySelector(".tex-veil__paper");
      if (paper && !reduceMotion()) {
        const shift = (index / Math.max(1, this.slides.length - 1)) * 20;
        paper.style.translate = `${shift * -1}px ${shift * 0.4}px`;
      }
      if (!instant) {
        this.locked = true;
        setTimeout(() => { this.locked = false; }, reduceMotion() ? 0 : 380);
      }
    }
  }

  // Boot: render then navigate
  if (!window.DECK_CONTENT || !window.__ATLAS_RENDER__) {
    console.error("DECK_CONTENT / renderer missing");
    return;
  }
  window.__ATLAS_RENDER__.renderDeck(window.DECK_CONTENT);
  const deck = new SlidePresentation();
  window.__ATLAS_DECK__ = deck;

  /* Edit mode: E / hotzone / localStorage / Ctrl+S export + sync DECK_CONTENT */
  const slides = deck.slides;
  const editToggle = document.getElementById("editToggle");
  const editHotzone = document.getElementById("editHotzone");
  const editSaveHint = document.getElementById("editSaveHint");
  const STORE_KEY = "ai-concept-atlas-edits-r5";
  let editorActive = false;
  let hideTimeout = null;

  function makeEditable() {
    slides.forEach((s) => {
      s.querySelectorAll("h1,h2,h3,p,li,td,th,.term,.def,.quote-text,.quote-attr,.subtitle,.lead,.essence,.why,.insight,.terminal-sample")
        .forEach((el) => el.setAttribute("contenteditable", "true"));
    });
  }
  function lockEditable() {
    slides.forEach((s) =>
      s.querySelectorAll("[contenteditable]").forEach((el) => el.removeAttribute("contenteditable")));
  }
  function saveEdits() {
    const data = {};
    slides.forEach((s, idx) => { data[idx] = s.innerHTML; });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
    editSaveHint.classList.add("show");
    clearTimeout(editSaveHint._t);
    editSaveHint._t = setTimeout(() => editSaveHint.classList.remove("show"), 1600);
  }

  function syncContentFromDom() {
    // Best-effort: copy visible text fields back into DECK_CONTENT by data-field
    slides.forEach((s, idx) => {
      const item = window.DECK_CONTENT[idx];
      if (!item) return;
      const map = {
        kicker: "kicker", title: "title", subtitle: "subtitle", lead: "lead",
        essence: "essence", why: "why", insight: "insight", quote: "quote",
        attribution: "attribution"
      };
      Object.keys(map).forEach((cls) => {
        const el = s.querySelector(`[data-field="${cls}"]`);
        if (el && map[cls] in item) item[map[cls]] = el.textContent.trim();
      });
      const how = [];
      s.querySelectorAll('[data-field^="how."]').forEach((el) => how.push(el.textContent.trim()));
      if (how.length && item.how) item.how = how;
    });
  }

  function toggleEdit(on) {
    editorActive = on;
    document.body.classList.toggle("edit-mode", on);
    editToggle.classList.toggle("active", on);
    if (on) {
      makeEditable();
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          slides.forEach((s, idx) => { if (data[idx]) s.innerHTML = data[idx]; });
        }
      } catch (e) {}
      editToggle.textContent = "完成 退出编辑";
    } else {
      lockEditable();
      saveEdits();
      editToggle.textContent = "编辑 E";
    }
  }

  editToggle.addEventListener("click", () => toggleEdit(!editorActive));
  editHotzone.addEventListener("mouseenter", () => {
    clearTimeout(hideTimeout);
    editToggle.style.opacity = "1";
    editToggle.style.pointerEvents = "auto";
  });
  editHotzone.addEventListener("mouseleave", () => {
    if (editorActive) return;
    hideTimeout = setTimeout(() => {
      editToggle.style.opacity = "";
      editToggle.style.pointerEvents = "";
    }, 400);
  });
  editToggle.addEventListener("mouseenter", () => clearTimeout(hideTimeout));
  editToggle.addEventListener("mouseleave", () => {
    if (editorActive) return;
    hideTimeout = setTimeout(() => {
      editToggle.style.opacity = "";
      editToggle.style.pointerEvents = "";
    }, 400);
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "e" || e.key === "E") {
      if (e.target && e.target.isContentEditable) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      toggleEdit(!editorActive);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      if (editorActive) {
        saveEdits();
        exportEdits();
      }
    }
  });

  slides.forEach((s) => {
    s.addEventListener("input", () => {
      if (!editorActive) return;
      clearTimeout(s._saveT);
      s._saveT = setTimeout(saveEdits, 600);
    });
  });

  function exportEdits() {
    syncContentFromDom();
    let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const markerStart = "const DECK_CONTENT = ";
    const start = html.indexOf(markerStart);
    if (start >= 0) {
      const after = start + markerStart.length;
      const winMark = html.indexOf("\n\nwindow.DECK_CONTENT", after);
      const renderMark = html.indexOf("\n\n/* === RENDER", after);
      let end = -1;
      if (winMark > after) end = winMark;
      else if (renderMark > after) end = renderMark;
      else {
        const close = html.indexOf("\n];", after);
        if (close >= 0) end = close + 3;
      }
      if (end > after) {
        const serialized = JSON.stringify(window.DECK_CONTENT, null, 2)
          .replace(/</g, "\\u003c")
          .replace(/<\//g, "<\\/");
        html = html.slice(0, start) + markerStart + serialized + ";" + html.slice(end);
      }
    }
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ai-concept-atlas-edited.html";
    a.click();
    URL.revokeObjectURL(a.href);
  }
})();

  </script>
</body>
</html>
