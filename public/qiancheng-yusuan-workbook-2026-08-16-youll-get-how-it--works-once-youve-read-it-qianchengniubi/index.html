/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
    transform: translateY(0);
    will-change: transform, opacity;
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* Vertical page transitions */
.slide.is-leaving,
.slide.is-entering {
    visibility: visible !important;
    pointer-events: none;
}

.slide.is-leaving {
    z-index: 2;
}

.slide.is-entering {
    z-index: 3;
}

.slide.exit-up {
    transform: translateY(0);
    opacity: 1;
}
.slide.exit-up.is-animating {
    transform: translateY(-1080px);
    opacity: 0;
    transition: transform 0.52s cubic-bezier(0.77, 0, 0.175, 1),
                opacity 0.52s cubic-bezier(0.77, 0, 0.175, 1);
}

.slide.exit-down {
    transform: translateY(0);
    opacity: 1;
}
.slide.exit-down.is-animating {
    transform: translateY(1080px);
    opacity: 0;
    transition: transform 0.52s cubic-bezier(0.77, 0, 0.175, 1),
                opacity 0.52s cubic-bezier(0.77, 0, 0.175, 1);
}

.slide.enter-from-below {
    transform: translateY(1080px);
    opacity: 0;
}
.slide.enter-from-below.is-animating {
    transform: translateY(0);
    opacity: 1;
    transition: transform 0.52s cubic-bezier(0.77, 0, 0.175, 1),
                opacity 0.52s cubic-bezier(0.77, 0, 0.175, 1);
}

.slide.enter-from-above {
    transform: translateY(-1080px);
    opacity: 0;
}
.slide.enter-from-above.is-animating {
    transform: translateY(0);
    opacity: 1;
    transition: transform 0.52s cubic-bezier(0.77, 0, 0.175, 1),
                opacity 0.52s cubic-bezier(0.77, 0, 0.175, 1);
}

@media (prefers-reduced-motion: reduce) {
    .slide.exit-up.is-animating,
    .slide.exit-down.is-animating,
    .slide.enter-from-below.is-animating,
    .slide.enter-from-above.is-animating {
        transition: none !important;
        transform: translateY(0) !important;
        opacity: 1 !important;
    }
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

*, *::before, *::after { box-sizing: border-box; }

.slide {
  background: var(--c-bg);
  color: var(--c-fg);
  font-family: var(--f-body);
  font-weight: 300;
  padding: var(--pad-y) var(--pad-x);
}

.slide.warm { background: var(--c-bg-cream); }
.slide.inset-alt { background: var(--c-bg-alt); }

.slide-inner {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Chrome */
.slide-chrome,
.slide-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.slide-chrome {
  padding-bottom: 12px;
  border-bottom: 1px solid var(--c-border);
  margin-bottom: 28px;
}
.slide-foot {
  padding-top: 12px;
  border-top: 1px solid var(--c-border);
  margin-top: auto;
}
.slide--cover .slide-chrome,
.slide--cover .slide-foot,
.slide--chapter .slide-chrome,
.slide--chapter .slide-foot,
.slide--end .slide-chrome,
.slide--end .slide-foot {
  display: none;
}

.mono-label {
  font-family: var(--f-mono);
  font-size: var(--sz-label);
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-fg-3);
}

.kicker {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
}
.kicker .rule-short {
  width: 36px;
  height: 1px;
  background: var(--c-border);
  flex-shrink: 0;
}
.kicker span {
  font-family: var(--f-mono);
  font-size: var(--sz-label);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-fg-3);
}

.display {
  font-family: var(--f-display);
  font-size: var(--sz-display);
  font-weight: 200;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--c-fg);
  margin: 0;
}
.h1 {
  font-family: var(--f-heading);
  font-size: var(--sz-h1);
  font-weight: 200;
  line-height: 1.12;
  letter-spacing: -0.025em;
  color: var(--c-fg);
  margin: 0;
}
.h2 {
  font-family: var(--f-heading);
  font-size: var(--sz-h2);
  font-weight: 300;
  line-height: 1.18;
  letter-spacing: -0.02em;
  color: var(--c-fg);
  margin: 0;
}
.h3 {
  font-family: var(--f-heading);
  font-size: var(--sz-h3);
  font-weight: 400;
  line-height: 1.25;
  color: var(--c-fg);
  margin: 0;
}
.serif-em {
  font-family: var(--f-serif);
  font-style: italic;
  font-weight: 400;
}
.lead {
  font-size: var(--sz-lead);
  font-weight: 300;
  line-height: 1.45;
  color: var(--c-fg-2);
  margin: 0;
}
.body {
  font-size: var(--sz-body);
  font-weight: 300;
  line-height: 1.5;
  color: var(--c-fg);
  margin: 0;
}
.caption {
  font-size: var(--sz-caption);
  color: var(--c-fg-3);
  margin: 0;
}
.code {
  font-family: var(--f-mono);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.01em;
}

/* Reveal */
.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity var(--dur-enter) var(--ease-enter),
              transform var(--dur-enter) var(--ease-enter);
}
.reveal-left {
  opacity: 0;
  transform: translateX(-36px);
  transition: opacity var(--dur-enter) var(--ease-enter),
              transform var(--dur-enter) var(--ease-enter);
}
.reveal-scale {
  opacity: 0;
  transform: scale(0.96);
  transition: opacity var(--dur-enter) var(--ease-enter),
              transform var(--dur-enter) var(--ease-enter);
}
.slide.active .reveal,
.slide.active .reveal-left,
.slide.active .reveal-scale {
  opacity: 1;
  transform: none;
}
.d1 { transition-delay: 0.05s; }
.d2 { transition-delay: 0.12s; }
.d3 { transition-delay: 0.19s; }
.d4 { transition-delay: 0.26s; }
.d5 { transition-delay: 0.33s; }
.d6 { transition-delay: 0.40s; }
.d7 { transition-delay: 0.47s; }

/* Layout helpers */
.row { display: flex; gap: 36px; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.gap-sm { gap: var(--gap-sm); }
.gap-md { gap: var(--gap-md); }
.gap-lg { gap: var(--gap-lg); }
.mt-sm { margin-top: var(--gap-sm); }
.mt-md { margin-top: var(--gap-md); }
.mt-lg { margin-top: var(--gap-lg); }
.mb-md { margin-bottom: var(--gap-md); }

.rule-full {
  width: 100%;
  height: 1px;
  background: var(--c-border);
  border: 0;
  margin: 0;
}
.rule-v {
  width: 1px;
  background: var(--c-border);
  align-self: stretch;
  flex-shrink: 0;
}

.dash-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.dash-list li {
  position: relative;
  padding-left: 28px;
  margin-bottom: 14px;
  font-size: var(--sz-body);
  line-height: 1.45;
  color: var(--c-fg);
}
.dash-list li::before {
  content: "—";
  position: absolute;
  left: 0;
  font-family: var(--f-mono);
  color: var(--c-fg-3);
  font-size: 16px;
}

.panel {
  border: 1px solid var(--c-border);
  background: var(--c-bg-alt);
  padding: 28px 30px;
}
.panel.soft {
  background: rgba(26, 26, 22, 0.03);
  border-color: rgba(26, 26, 22, 0.18);
}
.insight {
  border-radius: 16px;
  background: var(--c-bg-cream);
  padding: 32px 34px;
}
.insight .insight-title {
  font-family: var(--f-serif);
  font-size: 28px;
  font-weight: 400;
  margin: 0 0 12px;
  color: var(--c-fg);
}

.flow {
  display: flex;
  align-items: stretch;
  gap: 12px;
}
.flow-step {
  flex: 1;
  border: 1px solid var(--c-border);
  padding: 20px 18px;
  background: transparent;
  min-width: 0;
}
.flow-step .num {
  font-family: var(--f-display);
  font-size: 28px;
  font-weight: 200;
  letter-spacing: -0.03em;
  color: var(--c-fg);
  margin-bottom: 10px;
}
.flow-step .title {
  font-size: 20px;
  font-weight: 400;
  margin: 0 0 8px;
  color: var(--c-fg);
}
.flow-step .sub {
  font-size: 15px;
  color: var(--c-fg-2);
  line-height: 1.4;
  margin: 0;
}
.flow-arrow {
  display: flex;
  align-items: center;
  color: var(--c-fg-3);
  font-family: var(--f-mono);
  font-size: 18px;
  flex-shrink: 0;
  padding-top: 8px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 28px;
}
.grid-4 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 20px;
}
.grid-5 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 18px;
}

.cell {
  border-top: 1px solid var(--c-border);
  padding-top: 18px;
}
.cell .label {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-fg-3);
  margin-bottom: 10px;
}
.cell .q {
  font-size: 24px;
  font-weight: 400;
  line-height: 1.3;
  margin: 0 0 10px;
  color: var(--c-fg);
}
.cell .a {
  font-size: 18px;
  color: var(--c-fg-2);
  line-height: 1.4;
  margin: 0;
}

.outcome {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 8px 20px;
  align-items: baseline;
  padding: 16px 0;
  border-bottom: 1px solid rgba(26, 26, 22, 0.15);
}
.outcome:last-child { border-bottom: 0; }
.outcome .n {
  font-family: var(--f-display);
  font-size: 36px;
  font-weight: 200;
  letter-spacing: -0.03em;
}
.outcome .t {
  font-size: 28px;
  font-weight: 400;
}
.outcome .d {
  grid-column: 2;
  font-size: 18px;
  color: var(--c-fg-2);
}

.callout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  margin-top: 28px;
}
.callout .bar {
  width: 2px;
  align-self: stretch;
  background: var(--c-border);
  flex-shrink: 0;
}
.callout p {
  margin: 0;
  font-size: 20px;
  line-height: 1.45;
  color: var(--c-fg);
  font-family: var(--f-serif);
  font-style: italic;
}

.terminal {
  background: #1a1a16;
  color: #fafadf;
  padding: 28px 32px;
  font-family: var(--f-mono);
  font-size: 18px;
  line-height: 1.7;
  border: 1px solid #1a1a16;
}
.terminal .head {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8a8a80;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid #3a3a34;
}
.terminal .prompt { color: #c8c4a8; }
.terminal .ok { color: #b8b48a; margin-top: 14px; }

.tree {
  font-family: var(--f-mono);
  font-size: 18px;
  line-height: 1.85;
  color: var(--c-fg);
}
.tree .hint { color: var(--c-fg-2); }

.cover-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 56px;
  height: 100%;
  align-items: stretch;
}
.cover-art {
  border: 1px solid var(--c-border);
  background:
    radial-gradient(circle at 42% 44%, #d4b84a 0 92px, transparent 94px),
    linear-gradient(135deg, #f2f2d2 0 48%, #1a1a16 48%);
  position: relative;
  overflow: hidden;
}
.cover-art::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(#1a1a16 0.7px, transparent 0.8px);
  background-size: 5px 5px;
  opacity: 0.18;
  pointer-events: none;
}
.cover-art-inner {
  position: absolute;
  left: 28px;
  right: 28px;
  bottom: 28px;
  z-index: 1;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid #fafadf;
  color: #fafadf;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 12px;
  background: rgba(26, 26, 22, 0.55);
}
.chip.light {
  border-color: var(--c-border);
  color: var(--c-fg);
  background: rgba(250, 250, 223, 0.85);
}

.q-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 24px;
}
.q-box {
  background: rgba(26, 26, 22, 0.04);
  border: 1px solid rgba(26, 26, 22, 0.14);
  padding: 18px 20px;
  font-size: 18px;
  color: var(--c-fg-2);
}

/* Page progress (N/22) — ledger ruler + ink fill + paper grain */
.progress-track {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 3px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(26, 26, 22, 0.28) 0 1px,
      transparent 1px calc(100% / 22)
    ),
    linear-gradient(180deg, rgba(26, 26, 22, 0.32) 0%, rgba(250, 250, 223, 0.05) 100%);
  z-index: 1001;
  pointer-events: none;
}
.progress {
  position: absolute;
  left: 0;
  top: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(
    90deg,
    rgba(26, 26, 22, 0.62) 0%,
    rgba(94, 94, 84, 0.38) 8%,
    #fafadf 24%,
    #fafadf 100%
  );
  box-shadow: 0 0 10px rgba(250, 250, 223, 0.2);
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.progress::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--tex-paper);
  background-size: 480px auto;
  background-repeat: repeat-x;
  opacity: 0.5;
  mix-blend-mode: soft-light;
}
.progress::after {
  content: "";
  position: absolute;
  right: 0;
  top: -4px;
  width: 1px;
  height: 11px;
  background: #1a1a16;
  box-shadow: 0 0 6px rgba(26, 26, 22, 0.35);
}

/* Full-deck texture veil — 对参 germany-shopify deck：素纸 + perlin，无花。 */
.deck-texture {
  position: fixed;
  inset: 0;
  z-index: 500;
  pointer-events: none;
  overflow: hidden;
}
.deck-texture__paper {
  position: absolute;
  inset: -3%;
  background-image: var(--tex-paper);
  background-size: 640px 480px;
  opacity: 0.085;
  mix-blend-mode: multiply;
  animation: tex-drift 90s linear infinite alternate;
  will-change: transform;
}
.deck-texture__noise {
  position: absolute;
  inset: -3%;
  background-image: var(--tex-perlin);
  background-size: 640px 480px;
  opacity: 0.05;
  mix-blend-mode: multiply;
  animation: tex-grain 3.4s ease-in-out infinite;
  will-change: transform;
}
@keyframes tex-drift {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-26px, 14px, 0); }
}
@keyframes tex-grain {
  0%   { transform: translate3d(0, 0, 0); }
  20%  { transform: translate3d(-7px, 5px, 0); }
  45%  { transform: translate3d(5px, -6px, 0); }
  70%  { transform: translate3d(-4px, -3px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .deck-texture__paper,
  .deck-texture__noise { animation: none; }
}

/* Right-middle chapter indicator — slim vertical ledger rail */
.deck-chapter {
  position: fixed;
  right: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 9px;
  pointer-events: none;
  max-width: 84px;
  padding: 10px 6px 12px 8px;
  background: rgba(250, 250, 223, 0.92);
  border-right: 1px solid rgba(26, 26, 22, 0.32);
  box-shadow: -2px 0 8px rgba(26, 26, 22, 0.06);
}
.deck-chapter__page {
  font-family: var(--f-serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: #1a1a16;
  line-height: 1.1;
  white-space: nowrap;
}
.deck-chapter__rule {
  width: 22px;
  height: 1px;
  background: rgba(26, 26, 22, 0.42);
  align-self: flex-end;
}
.deck-chapter__name {
  font-family: var(--f-mono);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(26, 26, 22, 0.68);
  text-align: right;
  line-height: 1.55;
  word-break: normal;
  overflow-wrap: normal;
  max-width: 100%;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
@media (max-width: 640px) {
  .deck-chapter {
    right: 8px;
    max-width: 72px;
    padding: 8px 6px 10px 7px;
    gap: 6px;
  }
  .deck-chapter__page { font-size: 12px; letter-spacing: 0.08em; }
  .deck-chapter__rule { width: 16px; }
  .deck-chapter__name {
    font-size: 8px;
    letter-spacing: 0.1em;
    max-width: 68px;
  }
}


/* Round 4 — micro-interactions (hover / click / enter replay) */
.slide.active:not(.reveal-ready) .reveal,
.slide.active:not(.reveal-ready) .reveal-left,
.slide.active:not(.reveal-ready) .reveal-scale {
  opacity: 0;
  transform: translateY(22px);
}
.slide.active:not(.reveal-ready) .reveal-left { transform: translateX(-36px); }
.slide.active:not(.reveal-ready) .reveal-scale { transform: scale(0.96); }

.flow-step {
  cursor: default;
  transition: border-color 0.24s var(--ease-out-expo), background 0.24s var(--ease-out-expo),
              transform 0.24s var(--ease-out-expo), box-shadow 0.24s var(--ease-out-expo);
}
.flow-step:hover {
  border-color: var(--c-border);
  background: rgba(26, 26, 22, 0.035);
  transform: translateY(-2px);
  box-shadow: 0 3px 0 rgba(26, 26, 22, 0.07);
}
.flow-step:hover .title { text-decoration: underline; text-underline-offset: 5px; }
.flow-step:hover .sub { color: var(--c-fg); }
.flow-step:active { transform: translateY(0); transition-duration: 0.08s; }

.panel {
  transition: border-color 0.24s var(--ease-out-expo), background 0.24s var(--ease-out-expo),
              transform 0.24s var(--ease-out-expo);
}
.panel:hover {
  border-color: var(--c-border);
  background: rgba(26, 26, 22, 0.045);
  transform: translateX(4px);
}
.panel:active { transform: translateX(2px); transition-duration: 0.08s; }

.terminal {
  transition: box-shadow 0.26s var(--ease-out-expo), transform 0.26s var(--ease-out-expo);
  cursor: default;
}
.terminal:hover {
  box-shadow: inset 0 0 0 1px rgba(250, 250, 223, 0.12), 5px 5px 0 rgba(250, 250, 223, 0.06);
  transform: translateY(-2px);
}
.terminal:active { transform: translateY(0); transition-duration: 0.08s; }

.insight {
  transition: transform 0.26s var(--ease-out-expo), box-shadow 0.26s var(--ease-out-expo);
  cursor: default;
}
.insight:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 0 rgba(26, 26, 22, 0.06);
}
.insight:active { transform: translateY(-1px); transition-duration: 0.08s; }

.chip {
  cursor: default;
  transition: background 0.22s var(--ease-out-expo), color 0.22s var(--ease-out-expo),
              border-color 0.22s var(--ease-out-expo), transform 0.08s linear;
}
.chip:hover {
  background: #fafadf;
  color: #1a1a16;
  border-color: #fafadf;
}
.chip.light:hover {
  background: #1a1a16;
  color: #fafadf;
  border-color: #1a1a16;
}
.chip:active { transform: translateY(1px); }

.q-box {
  transition: border-color 0.22s var(--ease-out-expo), background 0.22s var(--ease-out-expo),
              transform 0.22s var(--ease-out-expo);
  cursor: default;
}
.q-box:hover {
  border-color: rgba(26, 26, 22, 0.42);
  background: rgba(26, 26, 22, 0.065);
  transform: translateX(4px);
}
.q-box:active { transform: translateX(2px); transition-duration: 0.08s; }

.code {
  transition: background 0.2s var(--ease-out-expo), box-shadow 0.2s var(--ease-out-expo);
}
.code:hover {
  background: rgba(26, 26, 22, 0.06);
  box-shadow: inset 0 -2px 0 rgba(26, 26, 22, 0.35);
}

.cover-art {
  transition: transform 0.28s var(--ease-out-expo), box-shadow 0.28s var(--ease-out-expo);
  cursor: default;
}
.slide.active .cover-art:hover {
  transform: scale(1.012);
  box-shadow: 5px 5px 0 rgba(26, 26, 22, 0.1);
}
.slide.active .cover-art:active {
  transform: scale(1.004);
  transition-duration: 0.08s;
}

@media (prefers-reduced-motion: reduce) {
  .flow-step:hover, .panel:hover, .terminal:hover, .insight:hover,
  .q-box:hover, .cover-art:hover {
    transform: none !important;
    box-shadow: none !important;
  }
  .flow-step:active, .panel:active, .terminal:active, .insight:active,
  .q-box:active, .chip:active, .cover-art:active {
    transform: none !important;
  }
}

/* 附 A · selection (no page scrollbar — fixed stage) */
::selection {
  background: #1a1a16;
  color: #fafadf;
}

/* 9 · closing restrained celebrate */
.slide--end .end-celebrate {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 28px;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
}
.slide--end.active .end-celebrate {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.28s,
              transform 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.28s;
}
.slide--end .end-celebrate .end-rule {
  width: 0;
  height: 1px;
  background: #1a1a16;
  transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
}
.slide--end.active .end-celebrate .end-rule { width: 72px; }
.slide--end .end-celebrate span {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #8a8a80;
}
@media (prefers-reduced-motion: reduce) {
  .slide--end.active .end-celebrate,
  .slide--end.active .end-celebrate .end-rule {
    transition: none !important;
  }
  .slide--end.active .end-celebrate { opacity: 1; transform: none; }
  .slide--end.active .end-celebrate .end-rule { width: 72px; }
}


/* --- viz + edit bridges --- */
.edit-hotzone { position:fixed; top:0; right:0; width:72px; height:72px; z-index:90; }
.edit-toggle {
  position:fixed; top:18px; right:18px; z-index:95; opacity:0; pointer-events:none;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  padding:10px 14px; border:1px solid var(--c-border); background:var(--c-bg); color:var(--c-fg); cursor:pointer;
}
.edit-toggle.active, body.edit-mode .edit-toggle { opacity:1; pointer-events:auto; }
.edit-save-hint {
  position:fixed; bottom:22px; right:22px; z-index:95; opacity:0; pointer-events:none;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  padding:10px 14px; border:1px solid var(--c-border); background:var(--c-bg-cream); color:var(--c-fg);
}
.edit-save-hint.show { opacity:1; }
body.edit-mode [contenteditable="true"] { outline:1px dashed rgba(26,26,22,.25); outline-offset:3px; cursor:text; }
.grid-1 { display:grid; grid-template-columns:1fr; gap:16px; }

/* data table */
.deck-table-wrap { flex:1; min-height:0; overflow:hidden; margin-top:18px; }
.deck-table {
  width:100%; border-collapse:collapse; font-size:18px; line-height:1.35;
  font-family:var(--f-body);
}
.deck-table.compact { font-size:15px; }
.deck-table th {
  font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--c-fg-3); text-align:left; padding:10px 12px; border-bottom:2px solid var(--c-border);
  font-weight:500;
}
.deck-table td {
  padding:11px 12px; border-bottom:1px solid rgba(26,26,22,.12); color:var(--c-fg);
  vertical-align:top;
}
.deck-table tr:last-child td { border-bottom:none; }
.deck-table td.em { font-family:var(--f-serif); font-style:italic; }
.deck-table .tag {
  display:inline-block; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; border:1px solid var(--c-border); padding:2px 8px;
}

/* number wall */
.num-wall {
  display:grid; grid-template-columns:repeat(4, 1fr); gap:22px; margin-top:28px;
}
.num-wall.cols-3 { grid-template-columns:repeat(3, 1fr); }
.num-card {
  border-top:2px solid var(--c-border); padding-top:18px;
}
.num-card .v {
  font-family:var(--f-display); font-weight:300; font-size:56px; line-height:1; letter-spacing:-0.02em;
}
.num-card .u {
  font-family:var(--f-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--c-fg-3); margin-top:10px;
}
.num-card .n {
  font-size:18px; color:var(--c-fg-2); margin-top:8px; line-height:1.4;
}

/* bars */
.bar-list { display:flex; flex-direction:column; gap:16px; margin-top:22px; }
.bar-row { display:grid; grid-template-columns:220px 1fr 160px; gap:16px; align-items:center; }
.bar-row .lab { font-family:var(--f-mono); font-size:13px; letter-spacing:.08em; color:var(--c-fg-2); }
.bar-track { height:28px; background:var(--c-bg-alt); border:1px solid var(--c-border); position:relative; }
.bar-fill { height:100%; background:var(--c-fg); }
.bar-fill.alt { background:transparent; border-right:3px solid var(--c-fg); box-sizing:border-box; }
.bar-dual { display:flex; height:28px; border:1px solid var(--c-border); }
.bar-dual .de { background:var(--c-fg); }
.bar-dual .cn { background:var(--c-bg-cream); border-left:1px solid var(--c-border); }
.bar-row .val { font-family:var(--f-serif); font-size:18px; text-align:right; }

/* spectrum */
.spectrum {
  margin-top:48px; position:relative; height:120px;
}
.spectrum .rail {
  position:absolute; left:80px; right:80px; top:48px; height:18px;
  background:linear-gradient(90deg, var(--c-fg) 0%, var(--c-fg) 33%, var(--c-bg-alt) 33%, var(--c-bg-alt) 66%, var(--c-bg-cream) 66%, var(--c-bg-cream) 100%);
  border:1px solid var(--c-border);
}
.spectrum .tick {
  position:absolute; top:20px; width:180px; text-align:center; transform:translateX(-50%);
}
.spectrum .tick .dot {
  width:16px; height:16px; border-radius:50%; background:var(--c-fg); margin:0 auto 14px; border:2px solid var(--c-bg);
}
.spectrum .tick .t { font-family:var(--f-serif); font-size:22px; }
.spectrum .tick .s { font-size:15px; color:var(--c-fg-2); margin-top:6px; }

/* funnel */
.funnel { display:flex; flex-direction:column; gap:10px; margin-top:28px; align-items:center; }
.funnel .step {
  border:1px solid var(--c-border); background:var(--c-bg);
  padding:16px 24px; text-align:center; font-size:20px;
}
.funnel .step.final { background:var(--c-fg); color:var(--c-bg); }
.funnel .arrow { font-family:var(--f-mono); color:var(--c-fg-3); font-size:14px; }

/* timeline */
.tl {
  display:grid; grid-template-columns:repeat(4, 1fr); gap:0; margin-top:40px;
  position:relative;
}
.tl::before {
  content:""; position:absolute; left:8%; right:8%; top:18px; height:2px; background:var(--c-border);
}
.tl-item { padding:0 18px; position:relative; }
.tl-item .dot {
  width:14px; height:14px; background:var(--c-fg); border-radius:50%; margin-bottom:22px; position:relative; z-index:1;
}
.tl-item .when {
  font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--c-fg-3);
}
.tl-item .what { font-family:var(--f-serif); font-size:22px; margin-top:8px; line-height:1.35; }
.tl-item .note { font-size:16px; color:var(--c-fg-2); margin-top:8px; }

/* bilingual */
.bi-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:22px; flex:1; min-height:0; }
.bi-col { border-top:2px solid var(--c-border); padding-top:16px; }
.bi-col .lang {
  font-family:var(--f-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--c-fg-3); margin-bottom:14px;
}
.bi-col .line {
  font-size:18px; line-height:1.5; padding:10px 0; border-bottom:1px solid rgba(26,26,22,.1);
  color:var(--c-fg);
}
.bi-col .line:last-child { border-bottom:none; }

/* score / heat cells */
.score-row { display:grid; grid-template-columns:160px repeat(5, 1fr); gap:8px; align-items:center; margin-top:10px; }
.score-row .lab { font-family:var(--f-mono); font-size:13px; color:var(--c-fg-2); }
.score-cell {
  height:42px; border:1px solid var(--c-border); display:flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); font-size:13px;
}
.score-cell.s1 { background:rgba(26,26,22,.06); }
.score-cell.s2 { background:rgba(26,26,22,.14); }
.score-cell.s3 { background:rgba(26,26,22,.28); color:#fff; }
.score-cell.s4 { background:rgba(26,26,22,.55); color:#fff; }
.score-cell.s5 { background:var(--c-fg); color:var(--c-bg); }

.people-grid {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; margin-top:24px;
}
.person {
  border:1px solid var(--c-border); padding:18px 20px; background:var(--c-bg);
}
.person .role { font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--c-fg-3); }
.person .name { font-family:var(--f-serif); font-size:26px; margin-top:8px; }
.person .note { font-size:16px; color:var(--c-fg-2); margin-top:10px; line-height:1.4; }

.pnl-bands {
  display: grid;
  grid-template-columns: 5fr 1.2fr 7fr;
  gap: 8px;
  margin: 14px 0 6px;
}
.pnl-band {
  border: 1px solid var(--c-border);
  padding: 12px 14px;
  font-family: var(--f-mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-align: center;
  line-height: 1.35;
}
.pnl-band.g1 { background: var(--c-fg); color: var(--c-bg); }
.pnl-band.g2 { background: var(--c-bg-cream); }
.pnl-band.g3 { background: var(--c-bg-alt); }

.tl.tl-6 { grid-template-columns: repeat(6, 1fr); }
.tl.tl-6 .what { font-size: 18px; }
.tl.tl-6 .note { font-size: 14px; }
.tl.tl-5 { grid-template-columns: repeat(5, 1fr); }

.bar-list.dense { gap: 10px; margin-top: 16px; }
.bar-list.dense .bar-track { height: 22px; }

/* Mermaid-like flowchart */
.viz-graph {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin-top: 18px;
  flex: 1;
  min-height: 0;
  justify-content: center;
}
.viz-row {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 16px;
  width: 100%;
  flex-wrap: wrap;
}
.viz-node {
  border: 1.5px solid var(--c-fg);
  background: var(--c-bg);
  padding: 12px 16px;
  min-width: 132px;
  max-width: 280px;
  text-align: center;
}
.viz-node--term { background: var(--c-fg); color: var(--c-bg); }
.viz-node--term .viz-node__s { color: rgba(250,250,223,.72); }
.viz-node--decision {
  background: var(--c-bg-cream);
  transform: none;
  border-style: dashed;
}
.viz-node--side { background: var(--c-bg-alt); }
.viz-node__t {
  font-family: var(--f-serif);
  font-size: 20px;
  line-height: 1.25;
}
.viz-node__s {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--c-fg-2);
  margin-top: 6px;
}
.viz-v {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 28px;
  justify-content: center;
  color: var(--c-fg);
}
.viz-v span {
  display: block;
  width: 1.5px;
  height: 14px;
  background: var(--c-fg);
}
.viz-v::after { content: "▼"; font-size: 11px; line-height: 1; margin-top: -2px; }
.viz-edge-lab {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--c-fg-3);
  margin: 2px 0;
}

/* Vertical bar chart */
.vchart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  height: 380px;
  margin-top: 28px;
  padding: 0 8px 0;
  border-bottom: 2px solid var(--c-fg);
  border-left: 2px solid var(--c-border);
}
.vchart-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  min-width: 0;
}
.vchart-val {
  font-family: var(--f-display);
  font-size: 22px;
  font-weight: 300;
  margin-bottom: 8px;
}
.vchart-bar {
  width: 64%;
  min-height: 8px;
  background: var(--c-fg);
}
.vchart-col.is-tail .vchart-bar { background: var(--c-fg-3); }
.vchart-lab {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--c-fg-2);
  margin-top: 10px;
  text-align: center;
  line-height: 1.3;
}


.md-source-link {
  display: inline-block;
  margin-top: 18px;
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 400;

  text-transform: uppercase;

  padding-bottom: 2px;
  width: fit-content;
  pointer-events: auto;
  position: relative;
  z-index: 5;
}
.md-source-link:hover { opacity: 0.62; }

          const winMark = html.indexOf("\n\nwindow.DECK_CONTENT", after);
          if (winMark > after) {
            const serialized = JSON.stringify(window.DECK_CONTENT, null, 2).replace(/</g, "\\u003c");
            html = html.slice(0, start) + markerStart + serialized + ";" + html.slice(winMark);
          }
        }
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
        a.download = "qiancheng-excel-architecture-deck.html"; a.click(); URL.revokeObjectURL(a.href);
      }
    }
  });
  slides.forEach((s) => s.addEventListener("input", () => { if (!editorActive) return; clearTimeout(s._saveT); s._saveT = setTimeout(saveEdits, 600); }));
})();

</script>
